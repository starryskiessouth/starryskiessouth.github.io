<section>
    <div class="box post">
        <a href="{{ .RelPermalink }}" class="image left">{{ partial "responsive-img.html" (dict "src" .Params.image "alt" .Params.image_alt "sizes" "(max-width: 736px) 35vw, 300px") }}</a>
        <div class="inner">
            <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
            <p>
                {{ with .Description }}
                    {{- . }}
                {{- else }}
                    {{- .Summary }}
                {{- end }}
            </p>
        </div>
    </div>
</section>
